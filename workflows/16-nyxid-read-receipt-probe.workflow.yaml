name: nyxid_read_receipt_probe
description: 单次只读 Base 调用，针对 managed workflow 的 NyxID provider receipt、首步输出和 committed 终态做最小回归验证。
roles:
  - id: verifier
    name: NyxID 回执验证员
steps:
  - id: read_base_records
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters: [page_size]
        header_parameters: []
        body_mode: none
        body_required: false
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"path_params":{"app_token":"__BASE_APP_TOKEN__","table_id":"__TABLE_RUN_EVIDENCE__"},"query":{"page_size":"1"}}'
    next: summarize_receipt

  - id: summarize_receipt
    type: transform
    op: template
    template: >-
      {{~ items = get(data.data, 'items', []); verified = data.code == 0 ~}}
      {{ json({ case: 'nyxid_read_receipt_probe', success: verified, provider_response_verified: verified, response_item_count: items.size, side_effects: false }) }}
    next: verify_receipt

  - id: verify_receipt
    type: transform
    op: template
    template: >-
      {{~ success = data.success == true && data.provider_response_verified == true && data.side_effects == false ~}}
      {{ json({ case: 'nyxid_read_receipt_probe', success: success, provider_response_verified: data.provider_response_verified, response_item_count: data.response_item_count, side_effects: false }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
