name: invoice_approval_routing_preview
description: 对合成发票完成附件提取、字段归一化、审批历史去重和申请人路由预览；只读取 Lark，不创建审批或发送消息。
roles:
  - id: extractor
    name: 发票预览字段提取员
    system_prompt: >-
      从提供的合成发票中提取字段，只返回纯 JSON，且必须恰好包含 vendor、vendor_key、
      amount_minor、currency、date、invoice_number、invoice_number_key 七个键。
      vendor 保留供应商名称；vendor_key 使用小写字母和连字符并移除公司后缀；
      amount_minor 使用整数分；currency 使用三字母 ISO 代码；date 使用 YYYY-MM-DD；
      invoice_number 保留发票号；invoice_number_key 使用大写字母、数字和连字符。
      S$、新加坡地址或 Pte Ltd 表示 SGD，不得默认成 USD。不要输出地址、银行信息或自由文本。
steps:
  - id: extract_document
    type: foreach
    parameters:
      items_source: input_file_refs
      sub_step_type: tool_call
      sub_param_tool: document_extract
      sub_param_arguments: '{"maxChars":6000}'
      min_concurrent_workers: "1"
      max_concurrent_workers: "1"
    next: extract_invoice_fields

  - id: extract_invoice_fields
    type: llm_call
    target_role: extractor
    parameters:
      prompt_prefix: "提取这份合成发票并按预览契约归一化，只返回七字段 JSON："
    next: normalize_invoice

  - id: normalize_invoice
    type: transform
    op: template
    template: >-
      {{~ vendor = get(data, 'vendor', ''); vendor_key = get(data, 'vendor_key', ''); amount_minor = number(get(data, 'amount_minor', 0)); currency = get(data, 'currency', ''); invoice_number = get(data, 'invoice_number', ''); invoice_number_key = get(data, 'invoice_number_key', ''); invoice_date = get(data, 'date', '') ~}}
      {{~ extraction_ok = vendor != '' && amount_minor > 0 && currency != '' && invoice_number != '' && invoice_date != '' ~}}
      {{~ normalization_ok = vendor_key == 'harbor-cloud' && amount_minor == 123450 && currency == 'SGD' && invoice_number_key == 'HC-2026-0804' && invoice_date == '2026-08-04' ~}}
      {{ json({ vendor_key: vendor_key, amount_minor: amount_minor, currency: currency, invoice_number_key: invoice_number_key, date: invoice_date, extraction_ok: extraction_ok, normalization_ok: normalization_ok }) }}
    next: list_approval_history

  - id: list_approval_history
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: GET
        path_template: /open-apis/approval/v4/instances
        query_parameters: [approval_code, page_size, start_time, end_time]
        header_parameters: []
        body_mode: none
        body_required: false
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"query":{"approval_code":"__LARK_APPROVAL_CODE__","page_size":"100","start_time":"1785772800000","end_time":"1785859199000"}}'
    next: summarize_history_window

  - id: summarize_history_window
    type: transform
    op: template
    template: >-
      {{~ codes = get(data.data, 'instance_code_list', []) ~}}
      {{ json({ history_api_reachable: data.code == 0, history_window_checked: data.code == 0, history_result_count: codes.size }) }}
    next: resolve_approval_route

  - id: resolve_approval_route
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: POST
        path_template: /open-apis/contact/v3/users/batch_get_id
        query_parameters: [user_id_type]
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
        risk: read_only
    parameters:
      tool: nyxid_proxy
      arguments: '{"query":{"user_id_type":"user_id"},"body":{"emails":["__LARK_CONTACT_EMAIL__"]}}'
    next: summarize_approval_route

  - id: summarize_approval_route
    type: transform
    op: template
    template: >-
      {{~ users = get(data.data, 'user_list', []); route_resolved = data.code == 0 && users.size == 1; if route_resolved; first = users[0]; route_resolved = get(first, 'user_id', '') != '' || get(first, 'open_id', '') != ''; end ~}}
      {{ json({ contact_api_reachable: data.code == 0, approval_route_resolved: route_resolved, resolved_count: users.size, identifiers_redacted: true }) }}
    next: assemble_review_context

  - id: assemble_review_context
    type: assign
    parameters:
      target: review_context
      value: >-
        {"invoice":${steps.normalize_invoice.output},"history_api":${steps.summarize_history_window.output},"approval_route":${steps.summarize_approval_route.output},"synthetic_history":[{"vendor_key":"harbor-cloud","invoice_number_key":"HC-2026-0804"},{"vendor_key":"harbor-cloud","invoice_number_key":"HC-2026-0719"},{"vendor_key":"northstar-network","invoice_number_key":"NN-2026-0801"}]}
    next: evaluate_preview

  - id: evaluate_preview
    type: transform
    op: template
    template: >-
      {{~ exact_matches = 0; vendor_matches = 0; for item in data.synthetic_history; if item.invoice_number_key == data.invoice.invoice_number_key; exact_matches = exact_matches + 1; end; if item.vendor_key == data.invoice.vendor_key; vendor_matches = vendor_matches + 1; end; end ~}}
      {{~ exact_duplicate_found = exact_matches == 1; same_vendor_history_verified = vendor_matches == 2 ~}}
      {{~ success = data.invoice.extraction_ok && data.invoice.normalization_ok && data.history_api.history_api_reachable && data.history_api.history_window_checked && exact_duplicate_found && same_vendor_history_verified && data.approval_route.contact_api_reachable && data.approval_route.approval_route_resolved && data.approval_route.resolved_count == 1 ~}}
      {{ json({ case: 'invoice_approval_routing_preview', success: success, execution_mode: 'preview', attachment_extracted: data.invoice.extraction_ok, invoice_normalized: data.invoice.normalization_ok, history_api_reachable: data.history_api.history_api_reachable, history_window_checked: data.history_api.history_window_checked, exact_duplicate_found: exact_duplicate_found, same_vendor_history_verified: same_vendor_history_verified, approval_route_resolved: data.approval_route.approval_route_resolved, identifiers_redacted: data.approval_route.identifiers_redacted, approval_created: false, message_sent: false, external_writes: false, side_effects: false }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
