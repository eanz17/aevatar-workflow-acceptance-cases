name: candidate_document_compliance_preview
description: Side-effect-free candidate document completeness preview using file ingress, document extraction, and an LLM classifier.
roles:
  - id: reviewer
    name: Candidate Document Reviewer
    system_prompt: >-
      Inspect the supplied candidate document and return one compact JSON object
      with these keys only: identity_present, experience_present,
      education_present, contact_present, consent_present. Every value must be
      a boolean. Do not reproduce names, email addresses, phone numbers,
      employers, schools, identifiers, addresses, or free text.
steps:
  - id: extract_documents
    type: foreach
    parameters:
      items_source: input_file_refs
      sub_step_type: tool_call
      sub_param_tool: document_extract
      sub_param_arguments: '{"maxChars":4000}'
      min_concurrent_workers: "1"
      max_concurrent_workers: "3"
    next: classify_completeness

  - id: classify_completeness
    type: llm_call
    target_role: reviewer
    parameters:
      prompt_prefix: >-
        Check whether the extracted candidate document contains the five
        required categories. Return only the requested boolean JSON.
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
