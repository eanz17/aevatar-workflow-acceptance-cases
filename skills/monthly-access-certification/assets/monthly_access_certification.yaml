name: monthly_access_certification
description: 受 2026 年日历门禁保护的月度访问认证，覆盖 Base 聚合、预览、审批创建、验证、完成通知和提醒模式。
roles:
  - id: coordinator
    name: 访问认证协调员
steps:
  - id: normalize_context
    type: transform
    op: template
    template: >-
      {{~ mode = get(data, 'mode', 'preview'); run_date = date(get(data, 'run_date', '2026-08-31')); period = get(data, 'period', '2026-08') ~}}
      {{~ if mode != 'preview' && mode != 'submit' && mode != 'reminder_preview' && mode != 'reminder_send'; number('不支持的月度访问认证模式'); end ~}}
      {{~ month_ends = {}; month_ends['2026-01'] = '2026-01-31'; month_ends['2026-02'] = '2026-02-28'; month_ends['2026-03'] = '2026-03-31'; month_ends['2026-04'] = '2026-04-30'; month_ends['2026-05'] = '2026-05-31'; month_ends['2026-06'] = '2026-06-30'; month_ends['2026-07'] = '2026-07-31'; month_ends['2026-08'] = '2026-08-31'; month_ends['2026-09'] = '2026-09-30'; month_ends['2026-10'] = '2026-10-31'; month_ends['2026-11'] = '2026-11-30'; month_ends['2026-12'] = '2026-12-31' ~}}
      {{~ expected_month_end = get(month_ends, period, ''); is_last_day = expected_month_end != '' && run_date == expected_month_end; route = 'SKIP'; if mode == 'reminder_preview'; route = 'REMINDER_PREVIEW'; else if mode == 'reminder_send'; route = 'REMINDER_SEND'; else if mode == 'preview'; route = 'PROCESS'; else if mode == 'submit' && is_last_day; route = 'PROCESS'; end ~}}
      {{ json({ route: route, is_last_day: is_last_day, mode: mode, period: period, run_date: run_date }) }}
    next: extract_calendar_route

  - id: extract_calendar_route
    type: transform
    parameters:
      op: json_extract
      path: route
    next: select_calendar_route

  - id: select_calendar_route
    type: switch
    parameters:
      on: "${steps.extract_calendar_route.output}"
      branch.PROCESS: read_review_records
      branch.REMINDER_PREVIEW: reminder_preview
      branch.REMINDER_SEND: send_reminder
      branch.SKIP: skipped
      branch._default: skipped
    branches:
      PROCESS: read_review_records
      REMINDER_PREVIEW: reminder_preview
      REMINDER_SEND: send_reminder
      SKIP: skipped
      _default: skipped

  - id: reminder_preview
    type: assign
    parameters:
      target: final
      value: '{"case":"monthly_access_certification","mode":"reminder_preview","message_sent":false,"period":"${steps.normalize_context.json.period}"}'
    next: done

  - id: send_reminder
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: POST
        path_template: /open-apis/im/v1/messages
        query_parameters: [receive_id_type]
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"query":{"receive_id_type":"user_id"},"body":{"receive_id":"__LARK_MESSAGE_RECIPIENT_ID__","msg_type":"text","content":"{\"text\":\"[Aevatar 手工验收] 月度访问审查提醒：请确认账户负责人、处理例外，并在月底前完成 ${steps.normalize_context.json.period} 认证。\"}"}}'
    next: combine_reminder_result

  - id: combine_reminder_result
    type: assign
    parameters:
      target: reminder_result
      value: >-
        {"context":${steps.normalize_context.output},"send":${steps.send_reminder.output}}
    next: summarize_reminder

  - id: summarize_reminder
    type: transform
    op: template
    template: >-
      {{ json({ case: 'monthly_access_certification', mode: 'reminder_send', success: data.send.code == 0, message_sent: data.send.code == 0, downstream_code: data.send.code, period: data.context.period }) }}
    next: done

  - id: skipped
    type: assign
    parameters:
      target: final
      value: '{"case":"monthly_access_certification","mode":"skipped","success":true,"reason":"submit_requires_month_end","run_date":"${steps.normalize_context.json.run_date}","side_effects":false}'
    next: done

  - id: read_review_records
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: GET
        path_template: /open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records
        query_parameters: [page_size]
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
      arguments: '{"path_params":{"app_token":"__BASE_APP_TOKEN__","table_id":"__TABLE_MONTHLY_ACCESS_REVIEWS__"},"query":{"page_size":"100"}}'
    next: combine_review_source

  - id: combine_review_source
    type: assign
    parameters:
      target: review_source
      value: >-
        {"context":${steps.normalize_context.output},"records":${steps.read_review_records.output}}
    next: aggregate_reviews

  - id: aggregate_reviews
    type: transform
    op: template
    template: >-
      {{~ period = data.context.period; total = 0; complete = 0; pending = 0; exceptions = 0; items = get(data.records.data, 'items', []) ~}}
      {{~ for item in items; fields = item.fields; if get(fields, 'Period', '') == period; total = total + 1; status = get(fields, 'Review Status', ''); if status == 'Complete'; complete = complete + 1; else; pending = pending + 1; end; exceptions = exceptions + number(get(fields, 'Exception Count', 0)); end; end ~}}
      {{~ if data.records.code != 0 || total == 0; number('月度访问审查记录不可用'); end ~}}
      {{ json({ period: period, total_accounts: total, completed_reviews: complete, pending_reviews: pending, exception_count: exceptions, source_ok: true }) }}
    next: build_certification_request

  - id: build_certification_request
    type: transform
    op: template
    template: >-
      {{~ detail = '[Aevatar 手工验收] 月度访问认证 ' + data.period + ' | 账户总数：' + ('' + data.total_accounts) + ' | 已完成：' + ('' + data.completed_reviews) + ' | 待处理：' + ('' + data.pending_reviews) + ' | 例外：' + ('' + data.exception_count) ~}}
      {{~ form = json([{ id: '__LARK_APPROVAL_DETAIL_WIDGET_ID__', type: 'textarea', value: detail }, { id: '__LARK_APPROVAL_LINK_WIDGET_ID__', type: 'input', value: 'https://example.larksuite.com/base/__BASE_APP_TOKEN__?table=__TABLE_MONTHLY_ACCESS_REVIEWS__' }]) ~}}
      {{ json({ query: { user_id_type: 'user_id' }, body: { approval_code: '__LARK_APPROVAL_CODE__', user_id: '__LARK_APPROVAL_USER_ID__', form: form } }) }}
    next: select_process_mode

  - id: select_process_mode
    type: switch
    parameters:
      on: "${steps.normalize_context.json.mode}"
      branch.submit: create_certification_approval
      branch.preview: preview_certification
      branch._default: preview_certification
    branches:
      submit: create_certification_approval
      preview: preview_certification
      _default: preview_certification

  - id: preview_certification
    type: assign
    parameters:
      target: final
      value: >-
        {"case":"monthly_access_certification","mode":"preview","success":true,"summary":${steps.aggregate_reviews.output},"approval_created":false,"message_sent":false}
    next: done

  - id: create_certification_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: POST
        path_template: /open-apis/approval/v4/instances
        query_parameters: [user_id_type]
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: build_verify_request

  - id: build_verify_request
    type: transform
    op: template
    template: >-
      {{~ if data.code != 0 || get(data.data, 'instance_code', '') == ''; number('月度认证审批创建失败'); end ~}}
      {{ json({ path_params: { instance_code: data.data.instance_code }, query: { user_id_type: 'user_id' } }) }}
    next: verify_certification_approval

  - id: verify_certification_approval
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: GET
        path_template: /open-apis/approval/v4/instances/{instance_code}
        query_parameters: [user_id_type]
        header_parameters: []
        body_mode: none
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: combine_completion_context

  - id: combine_completion_context
    type: assign
    parameters:
      target: completion_context
      value: >-
        {"summary":${steps.aggregate_reviews.output},"created":${steps.create_certification_approval.output},"verified":${steps.verify_certification_approval.output}}
    next: build_completion_notice

  - id: build_completion_notice
    type: transform
    op: template
    template: >-
      {{~ text = '[Aevatar 手工验收] 月度访问认证 ' + data.summary.period + ' 已提交。账户：' + ('' + data.summary.total_accounts) + '，待处理：' + ('' + data.summary.pending_reviews) + '，例外：' + ('' + data.summary.exception_count) + '，审批实例已创建并回读验证。' ~}}
      {{ json({ query: { receive_id_type: 'user_id' }, body: { receive_id: '__LARK_MESSAGE_RECIPIENT_ID__', msg_type: 'text', content: json({ text: text }) } }) }}
    next: send_completion_notice

  - id: send_completion_notice
    type: tool_call
    capability:
      nyxid_request:
        user_service_id: __LARK_USER_SERVICE_ID__
        method: POST
        path_template: /open-apis/im/v1/messages
        query_parameters: [receive_id_type]
        header_parameters: []
        body_mode: json
        body_required: true
        response_mode: text
    parameters:
      tool: nyxid_proxy
    next: combine_terminal_results

  - id: combine_terminal_results
    type: assign
    parameters:
      target: terminal_results
      value: >-
        {"summary":${steps.aggregate_reviews.output},"created":${steps.create_certification_approval.output},"verified":${steps.verify_certification_approval.output},"notified":${steps.send_completion_notice.output}}
    next: summarize_terminal_results

  - id: summarize_terminal_results
    type: transform
    op: template
    template: >-
      {{~ success = data.created.code == 0 && get(data.created.data, 'instance_code', '') != '' && data.verified.code == 0 && data.notified.code == 0 ~}}
      {{ json({ case: 'monthly_access_certification', mode: 'submit', success: success, summary: data.summary, instance_code: get(data.created.data, 'instance_code', ''), approval_status: get(data.verified.data, 'status', 'UNKNOWN'), message_sent: data.notified.code == 0 }) }}
    next: done

  - id: done
    type: assign
    parameters:
      target: final
      value: "$input"
