name: 部署验收报告

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - README.md
      - report/**
      - validation/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}report/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: 准备静态报告
        run: |
          mkdir _site
          cp -R report validation _site/
          cp README.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
