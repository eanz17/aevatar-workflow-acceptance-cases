name: 验证工作流

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: 验证公开模板
        run: ruby scripts/validate_workflows.rb
      - name: 生成示例配置
        run: ruby scripts/materialize_workflows.rb config.example.yaml
      - name: 解析生成后的工作流
        run: >-
          ruby -ryaml -e 'Dir["build/workflows/*.yaml"].sort.each {
            |file| YAML.safe_load(File.read(file), aliases: false)
          }; puts "通过 已生成工作流=11"'
