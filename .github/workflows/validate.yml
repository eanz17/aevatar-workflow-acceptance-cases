name: 验证工作流

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: 验证公开模板
        run: ruby scripts/validate_workflows.rb
      - name: 验证 Lark channel E2E 案例
        run: ruby scripts/validate_channel_cases.rb
      - name: 验证风险验收案例
        run: ruby scripts/validate_risk_cases.rb
      - name: 生成示例配置
        run: ruby scripts/materialize_workflows.rb config.example.yaml
      - name: 解析生成后的工作流
        run: >-
          ruby -ryaml -e 'Dir["build/workflows/*.yaml"].sort.each {
            |file| YAML.safe_load(File.read(file), aliases: false)
          }; puts "通过 已生成工作流=#{Dir["build/workflows/*.yaml"].length}"'
      - name: 验证 Ornn skills
        run: ruby scripts/validate_skills.rb
      - name: 验证生产与自然语言脚本语法
        run: >-
          ruby -c scripts/production_validate.rb &&
          ruby -c scripts/assistant_validate.rb &&
          ruby -c scripts/publish_skills.rb &&
          ruby -c scripts/run_admission_probes.rb &&
          ruby -c scripts/verify_public_catalog.rb
      - name: 打包示例 Ornn skills
        run: ruby scripts/package_skills.rb config.example.yaml
      - name: 验证报告一致性
        run: ruby scripts/validate_report.rb
      - name: 检查分析页脚本
        run: >-
          ruby -e 'html = File.read("report/index.html");
          print html.scan(%r{<script>(.*?)</script>}m).flatten.join("\n")' |
          node --check -
